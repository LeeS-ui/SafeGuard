  <text x="574" y="2022" font-size="22" font-weight="800" fill="#0C5961" text-anchor="middle">U</text>
  <text x="544" y="2078" font-size="17" font-weight="700" fill="#1C1C1C" >Unity</text>
  <text x="544" y="2100" font-size="12.5" font-weight="400" fill="#696969" >게임 엔진</text>
  <text x="544" y="2128" font-size="14" font-weight="400" fill="#444444" >2D 및 3D 게임, WebGL 콘텐츠를</text>
  <text x="544" y="2150" font-size="14" font-weight="400" fill="#444444" >만들 수 있는 실시간 3D 플랫폼</text>
</g>
