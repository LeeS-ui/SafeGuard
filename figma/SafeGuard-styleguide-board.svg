  <text x="256" y="2342" font-size="22" font-weight="600" fill="#FFFFFF">보호자는 실종 대응 절차를 <tspan fill="#FFBE2B" font-weight="800">실제 상황 전에 연습할 수단이 없어</tspan>, 정작 골든타임에 대응이 지연됩니다.</text>
