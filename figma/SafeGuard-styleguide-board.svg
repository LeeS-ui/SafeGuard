<g id="Typography">
  <text x="80" y="610" font-size="28" font-weight="700" fill="#1C1C1C" >02  Typography</text>
  <text x="80" y="640" font-size="14" font-weight="400" fill="#696969" >Pretendard 단일 폰트 · 굵기 400 / 600 / 700 / 800 · 자간 -0.01em (제목 -0.03em)</text>
  <text x="80" y="700" font-size="64" font-weight="800" fill="#0C5961" letter-spacing="-3">Safe<tspan fill="#FFBE2B">Guard</tspan></text>
  <text x="860" y="700" font-size="13" font-weight="400" fill="#696969" >Hero 타이틀 · clamp(56, 11vw, 138) · 800 · -0.05em</text>
  <text x="80" y="776" font-size="34" font-weight="700" fill="#1C1C1C" >실종 대응은 경험이 아닌 훈련으로</text>
  <text x="860" y="776" font-size="13" font-weight="400" fill="#696969" >슬로건 · clamp(22, 3vw, 38) · 700 · lh 1.4</text>
  <text x="80" y="852" font-size="40" font-weight="700" fill="#1C1C1C" >실종 대응, 왜 훈련이 필요할까요?</text>
  <text x="860" y="852" font-size="13" font-weight="400" fill="#696969" >섹션 제목 H2 · clamp(30, 4.4vw, 52) · 700 · lh 1.28</text>
  <text x="80" y="928" font-size="56" font-weight="800" fill="#13808A" >100만 명</text>
  <text x="860" y="928" font-size="13" font-weight="400" fill="#696969" >핵심 숫자 · clamp(44, 5.5vw, 68) · 800 · -0.04em</text>
  <text x="80" y="1004" font-size="22" font-weight="700" fill="#1C1C1C" >신고 후 발견까지 걸린 시간</text>
  <text x="860" y="1004" font-size="13" font-weight="400" fill="#696969" >카드 제목 · 17–22 · 700</text>
  <text x="80" y="1080" font-size="19" font-weight="400" fill="#696969" >치매 환자 실종은 시간과의 싸움입니다.</text>
  <text x="860" y="1080" font-size="13" font-weight="400" fill="#696969" >리드 문단 · clamp(16, 1.6vw, 19) · 400 · Gray</text>
  <text x="80" y="1156" font-size="16" font-weight="400" fill="#444444" >보호자는 실종 대응 절차를 연습할 수단이 없습니다.</text>
  <text x="860" y="1156" font-size="13" font-weight="400" fill="#696969" >본문 / 카드 설명 · 14–16 · 400 · lh 1.65</text>
  <text x="80" y="1232" font-size="12.5" font-weight="400" fill="#696969" >출처 · 경찰청 실종아동등 현황 통계, 2024</text>
  <text x="860" y="1232" font-size="13" font-weight="400" fill="#696969" >출처 / 캡션 · 12.5 · Gray</text>
  <circle cx="85" cy="1303" r="5" fill="#FFBE2B"/>
  <text x="100" y="1308" font-size="14" font-weight="700" fill="#13808A" letter-spacing="2">PROBLEM</text>
  <text x="860" y="1308" font-size="13" font-weight="400" fill="#696969" >Eyebrow · 14 · 700 · 자간 .14em · 영문 대문자</text>
</g>
<g id="Radius-Spacing">
  <text x="80" y="1440" font-size="28" font-weight="700" fill="#1C1C1C" >03  Radius &amp; Spacing</text>
  <rect x="80" y="1470" width="180" height="90" rx="8" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="96" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 8</text>
  <text x="96" y="1536" font-size="12" font-weight="400" fill="#0C5961" >칩 내부</text>
  <rect x="286" y="1470" width="180" height="90" rx="16" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="302" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 16</text>
  <text x="302" y="1536" font-size="12" font-weight="400" fill="#0C5961" >탭·입력</text>
  <rect x="492" y="1470" width="180" height="90" rx="20" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="508" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 20</text>
  <text x="508" y="1536" font-size="12" font-weight="400" fill="#0C5961" >작은 카드</text>
  <rect x="698" y="1470" width="180" height="90" rx="24" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="714" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 24</text>
  <text x="714" y="1536" font-size="12" font-weight="400" fill="#0C5961" >기본 카드</text>
  <rect x="904" y="1470" width="180" height="90" rx="32" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="920" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 32</text>
  <text x="920" y="1536" font-size="12" font-weight="400" fill="#0C5961" >캐러셀</text>
  <rect x="1110" y="1470" width="180" height="90" rx="45" fill="#DCEFEF" stroke="#13808A" stroke-width="2" />
  <text x="1126" y="1514" font-size="14" font-weight="700" fill="#0C5961" >radius 999</text>
  <text x="1126" y="1536" font-size="12" font-weight="400" fill="#0C5961" >버튼·배지</text>
  <rect x="80" y="1712" width="8" height="8" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="80" y="1745" font-size="12" font-weight="700" fill="#0C5961" >8</text>
  <rect x="116" y="1704" width="16" height="16" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="116" y="1745" font-size="12" font-weight="700" fill="#0C5961" >16</text>
  <rect x="160" y="1696" width="24" height="24" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="160" y="1745" font-size="12" font-weight="700" fill="#0C5961" >24</text>
  <rect x="212" y="1688" width="32" height="32" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="212" y="1745" font-size="12" font-weight="700" fill="#0C5961" >32</text>
  <rect x="272" y="1672" width="48" height="48" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="272" y="1745" font-size="12" font-weight="700" fill="#0C5961" >48</text>
  <rect x="348" y="1664" width="56" height="56" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="348" y="1745" font-size="12" font-weight="700" fill="#0C5961" >56</text>
  <rect x="432" y="1640" width="80" height="80" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="432" y="1745" font-size="12" font-weight="700" fill="#0C5961" >80</text>
  <rect x="540" y="1600" width="120" height="120" rx="4" fill="#DCEFEF" stroke="#B9DADC" stroke-width="2" />
  <text x="540" y="1745" font-size="12" font-weight="700" fill="#0C5961" >120</text>
  <text x="80" y="1775" font-size="13" font-weight="400" fill="#696969" >간격: 8 · 16 · 24 · 32 · 48 · 56 · 80 · 120px / 콘텐츠 폭 1200px / 섹션 상하 120px</text>
</g>
