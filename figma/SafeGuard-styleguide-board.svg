  <text x="112" y="2080" font-size="19" font-weight="700" fill="#0C5961" >65세 이상 10명 중 1명이 치매</text>
  <text x="112" y="2108" font-size="14" font-weight="400" fill="#696969" >유병률 9.25% · 국내 약 100만 명 추정</text>
  <line x1="112" y1="2150" x2="448" y2="2150" stroke="#E4E2DC" stroke-dasharray="4 4"/>
  <text x="112" y="2184" font-size="12.5" font-weight="400" fill="#696969" >출처 · 중앙치매센터 추정, 2024</text>
