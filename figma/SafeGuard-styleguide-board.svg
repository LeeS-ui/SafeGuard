  <text x="1148" y="2084" font-size="15" font-weight="400" fill="#696969" >달라지는 수색과 신고</text>
  <text x="1148" y="2106" font-size="15" font-weight="400" fill="#696969" >판단을 훈련합니다.</text>
</g>
